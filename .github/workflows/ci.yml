name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the release workflow for release-please's PR: events caused by
  # GITHUB_TOKEN do not start workflows, yet main requires these checks.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Squash merges use the PR title as the commit message, and release-please
  # derives the next version from those messages.
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install libraries for a headless Electron
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Daemon end-to-end test
        run: node scripts/daemon-smoke.mjs
      - name: UI test
        # The default 8-bit Xvfb screen makes Chromium fail to capture screenshots.
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/ui-smoke.mjs ui-smoke
      - name: Keep UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: ui-smoke/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `os` names the required check; `runner` is where it runs. Linux
          # packages are built on the oldest supported Ubuntu, because native
          # modules only run on a glibc at least as new as the build's.
          - os: ubuntu-latest
            runner: ubuntu-22.04
            args: --linux
          - os: macos-latest
            runner: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            runner: windows-latest
            args: --win
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package without installers
        run: npx electron-builder ${{ matrix.args }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Native modules run on glibc 2.35 (Ubuntu 22.04, Debian 12) and newer
        if: runner.os == 'Linux'
        run: |
          max=$(find release/linux-unpacked/resources -name '*.node' \
              ! -path '*/prebuilds/win32-*' ! -path '*/prebuilds/darwin-*' -exec objdump -T {} + |
            grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "Newest glibc symbol: $max"
          test "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -n 1)" = GLIBC_2.35
