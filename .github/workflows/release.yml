name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach installers for, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a "chore: release x.y.z" PR up to date with the version and changelog
  # derived from the commits on main. Merging that PR tags and publishes the release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installers:
    name: Installers (${{ matrix.os }})
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
            files: release/*.AppImage release/*.deb
          - os: macos-latest
            args: --mac --arm64 --x64
            files: release/*.dmg
          - os: windows-latest
            args: --win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Attach installers to the release
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
